# Render Blueprint for Turium AI Knowledge Inbox
# Provisions backend Web Service and frontend Static Site with zero downtime health checks.

services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: turium-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false # Set to frontend URL, e.g. https://turium-ai-frontend.onrender.com
      - key: TURSO_DATABASE_URL
        sync: false # libsql://<db-name>-<org>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false # Turso Cloud JWT
      - key: QDRANT_URL
        sync: false # https://<cluster-id>.qdrant.tech
      - key: QDRANT_API_KEY
        sync: false # Qdrant Cloud API Key
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio API Key
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: 1536

  # 2. Frontend Static Site (React / Vite on Global CDN)
  - type: static_site
    name: turium-ai-frontend
    buildCommand: npm install && npm run build:client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to backend URL, e.g. https://turium-ai-backend.onrender.com/api
